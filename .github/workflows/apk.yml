name: Build and Release AnymeX (Android APK)

# Builds ONLY the Android APKs in release mode, signed with the committed test
# key (android/app/testkey.jks), and publishes them to a fixed release ("apk").
# Re-running replaces only the Android APK assets. The test key is public and
# must NOT be used for official releases.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

permissions:
  contents: write

# Release fixa: nunca deixe dois runs alterando o mesmo tag "apk" ao mesmo tempo.
concurrency:
  group: anymex-apk-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Estado incremental do Dart/CMake. A key exata muda a cada commit, mas o
      # restore-keys reaproveita o estado do build anterior com o mesmo pubspec.lock.
      - name: Cache build incremental (Dart/CMake)
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            build/app/.cxx
            android/.gradle
          key: ${{ runner.os }}-android-incremental-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-incremental-${{ hashFiles('pubspec.lock') }}-

      - name: Cache CMake
        uses: actions/cache@v4
        with:
          path: ~/cmake
          key: cmake-3.18.1-linux-x64

      - name: Setup Android
        run: |
          if [ ! -d "$HOME/cmake/cmake-3.18.1-Linux-x86_64" ]; then
            mkdir -p $HOME/cmake && cd $HOME/cmake
            wget -q https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
            tar -xzf cmake-3.18.1-Linux-x86_64.tar.gz
          fi
          cd $GITHUB_WORKSPACE
          CMAKE_DIR="$HOME/cmake/cmake-3.18.1-Linux-x86_64"
          echo "cmake.dir=$CMAKE_DIR" >> android/local.properties
          # Sign the release build with the committed test key so the APK can
          # be installed directly without any repository secrets.
          cat > android/key.properties << EOF
          storePassword=anymex123
          keyPassword=anymex123
          keyAlias=anymextest
          storeFile=testkey.jks
          EOF

      - name: Setup Environment
        shell: bash
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GIT_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          GIT_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          GIT_CALLBACK_SCHEME: ${{ secrets.GIT_CALLBACK_SCHEME }}
          COMMENTS_BASE_URL: ${{ secrets.COMMENTS_BASE_URL }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WATCHIUM_SERVER_URL: ${{ secrets.WATCHIUM_SERVER_URL }}
          WATCHIUM_API_TOKEN: ${{ secrets.WATCHIUM_API_TOKEN }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=$CALLBACK_SCHEME
          GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY
          GIT_CLIENT_ID=$GIT_CLIENT_ID
          GIT_CLIENT_SECRET=$GIT_CLIENT_SECRET
          GIT_CALLBACK_SCHEME=$GIT_CALLBACK_SCHEME
          COMMENTS_BASE_URL=$COMMENTS_BASE_URL
          BOT_BASE_URL=$BOT_BASE_URL
          BOT_API_SECRET=$BOT_API_SECRET
          TMDB_API_KEY=$TMDB_API_KEY
          WATCHIUM_SERVER_URL=$WATCHIUM_SERVER_URL
          WATCHIUM_API_TOKEN=$WATCHIUM_API_TOKEN
          EOF

      - name: Build Android Release APKs (test key)
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk AnymeX-Android-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk AnymeX-Android-arm64-v8a.apk
          mv app-x86_64-release.apk AnymeX-Android-x86_64.apk
          mv app-release.apk AnymeX-Android-universal.apk
          ls -lh AnymeX-Android-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-test-release
          path: build/app/outputs/flutter-apk/AnymeX-Android-*.apk

      # Release fixa: os assets são substituídos a cada build (mesmo nome de arquivo).
      # softprops lida melhor com tag fixo; overwrite_files evita erro 422/já existe.
      - name: Publish APKs to the fixed release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: apk
          target_commitish: ${{ github.sha }}
          name: "AnymeX APK (teste)"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            APKs Android assinados com a chave pública de teste (não usar em produção).
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: build/app/outputs/flutter-apk/AnymeX-Android-*.apk
